<!DOCTYPE html>
<html>
<head>
    <title>FocusIQ</title>
</head>
<body>

    <h1>FocusIQ</h1>

   <form action="/add" method="POST">
    <input type="text" name="task" placeholder="Task name" required>
    <input type="date" name="deadline">
    <input type="number" name="estimate" placeholder="Minutes needed">
    <input type="text" name="tags" placeholder="Tags e.g. college, urgent">
    <button type="submit">Add</button>
</form>

    <!-- Task List -->
    <ul>
 {% for i, task in tasks %}
<li {% if task.done %}style="text-decoration: line-through; opacity: 0.5;"{% endif %}>
    <strong>{{ task.name }}</strong>
    | Deadline: {{ task.deadline }}
    | Estimate: {{ task.estimate }} mins
    | Tags: {{ task.tags }}
    {% if not task.done %}
        <a href="/done/{{ i }}">✅ Done</a>
    {% endif %}
    <a href="/delete/{{ i }}">Delete</a>
</li>
{% endfor %}

    <!-- AI Advice Button -->
    <a href="/advise">
        <button>Get AI Advice</button>
    </a>

    <!-- Show AI Advice if available -->
    {% if advice %}
        <h2>AI Says:</h2>
        <p style="white-space: pre-line;">{{ advice }}</p>
    {% endif %}


</body>
</html>
